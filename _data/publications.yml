# ===========================================================================
#  PUBLICATIONS
#  ---------------------------------------------------------------------------
#  To add a new paper: copy the block below, paste it at the TOP of `articles:`
#  and fill it in. Nothing else needs changing; the page rebuilds itself.
#
#    - year: 2027
#      authors: "Smith A, Rodriguez F, Jones B"
#      title: "Title of the paper, sentence case"
#      journal: "Journal Name"
#      detail: "12(3):123-145"     # volume(issue):pages, optional
#      doi: "10.1234/abcd.5678"    # optional, without the https://doi.org/ part
#      pdf: "filename.pdf"         # optional; file lives in assets/pdfs/
#      tag: "Editorial"            # optional little label: Review, Editorial, Chapter...
#      note: "Selected article"    # optional one-line note shown under the entry
#
#  "Rodriguez F" is bolded automatically wherever it appears in `authors`,
#  so keep that exact spelling.
# ===========================================================================

